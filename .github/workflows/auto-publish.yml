name: Weltbeobachter Auto Publish

on:
  schedule:
    - cron: '17 */2 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weltbeobachter-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run publisher
        shell: bash
        run: |
          if [ -f scripts/auto_publish.py ]; then
            python scripts/auto_publish.py
          else
            echo 'scripts/auto_publish.py is not present yet; no article generated.'
          fi

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No publishable changes.'
            exit 0
          fi
          git config user.name 'weltbeobachter-publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: automated news publication'
          git push
