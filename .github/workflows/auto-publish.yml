name: HeuteBlick Sources Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-publish.yml'
      - 'scripts/auto_publish.py'
  schedule:
    # Three opportunities per day; the script publishes no more than one roundup per Berlin date.
    - cron: '17 5,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weltbeobachter-daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current site
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build verified daily sources monitor
        run: python scripts/auto_publish.py

      - name: Commit only a complete publication
        shell: bash
        run: |
          git config user.name 'weltbeobachter-publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js data/auto-publish-state.json news-sitemap.xml sitemap.xml welt/
          if git diff --cached --quiet; then
            echo 'No new publication or sitemap update.'
            exit 0
          fi
          git commit -m "Update HeuteBlick sources monitor"
          git push
